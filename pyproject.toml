[project]
name = "spotify-download-optimizer"
version = "0.1.0"
description = "Keep a Spotify playlist synced to repeated tracks from limited recent history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
    "typer>=0.12.0",
]

[project.scripts]
spotify-download-optimizer = "spotify_download_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spotify_download_optimizer"]
